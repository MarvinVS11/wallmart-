<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Lista de compras · Walmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --azul:#0071dc;
    --azul-osc:#004f9a;
    --spark:#ffc220;
    --fondo:#eef2f9;
    --card:#ffffff;
    --tinta:#101828;
    --gris:#667085;
    --linea:#e6eaf2;
    --ok:#16a34a;
    --ok-bg:#e7f6ec;
    --rojo:#dc2626;
    --radio:16px;
    --sombra:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--fondo);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:120px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit}

  /* ---------- Encabezado ---------- */
  header{
    background:linear-gradient(135deg,var(--azul) 0%,var(--azul-osc) 100%);
    color:#fff;padding:22px 20px 26px;position:sticky;top:0;z-index:30;
    border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(0,79,154,.25);
  }
  .marca{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
  .spark{width:26px;height:26px;flex:none;color:var(--spark)}
  .marca small{font-weight:500;font-family:'Inter';opacity:.85;font-size:.72rem;display:block;letter-spacing:.04em;text-transform:uppercase}

  .resumen{display:flex;gap:10px;margin-top:18px}
  .pill{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    border-radius:14px;padding:11px 13px;backdrop-filter:blur(4px)}
  .pill .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
  .pill .val{font-family:'Poppins';font-weight:700;font-size:1.18rem;margin-top:2px;line-height:1}
  .pill.total{background:var(--spark);color:#3d2b00;border-color:transparent}
  .pill.total .lbl{opacity:.7}

  /* ---------- Contenedor ---------- */
  main{max-width:640px;margin:0 auto;padding:18px 16px 0}

  /* ---------- Buscar / filtro ---------- */
  .barra{display:flex;gap:8px;margin-bottom:14px}
  .buscar{flex:1;position:relative}
  .buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gris);width:17px;height:17px}
  .buscar input{width:100%;padding:11px 12px 11px 36px;border:1px solid var(--linea);border-radius:12px;
    background:var(--card);font-size:.92rem;outline:none;transition:border-color .15s}
  .buscar input:focus{border-color:var(--azul)}
  .filtro{border:1px solid var(--linea);border-radius:12px;background:var(--card);padding:0 10px;font-size:.88rem;color:var(--tinta);outline:none}

  /* ---------- Lista ---------- */
  .grupo-titulo{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--gris);margin:18px 4px 8px}
  .grupo-titulo .cuenta{background:var(--linea);color:var(--gris);border-radius:20px;padding:1px 8px;font-size:.7rem}

  .item{background:var(--card);border-radius:var(--radio);box-shadow:var(--sombra);
    display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;
    transition:transform .12s ease, opacity .2s}
  .item:active{transform:scale(.99)}
  .check{width:25px;height:25px;flex:none;border-radius:50%;border:2px solid #cdd5e3;
    display:grid;place-items:center;transition:all .15s}
  .check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .15s}
  .item.listo .check{background:var(--ok);border-color:var(--ok)}
  .item.listo .check svg{opacity:1;transform:scale(1)}
  .item.listo .nombre{text-decoration:line-through;color:var(--gris)}
  .item.listo{opacity:.72}

  .info{flex:1;min-width:0}
  .nombre{font-weight:600;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:8px;align-items:center;margin-top:3px;font-size:.78rem;color:var(--gris);flex-wrap:wrap}
  .cat-tag{background:#eef4ff;color:var(--azul);border-radius:6px;padding:1px 7px;font-weight:600;font-size:.72rem}
  .precio{font-family:'Poppins';font-weight:700;font-size:.97rem;white-space:nowrap}

  .acciones{display:flex;gap:4px}
  .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--gris);transition:background .15s,color .15s}
  .ic:hover{background:#f3f5fa}
  .ic.del:hover{background:#fdeaea;color:var(--rojo)}
  .ic svg{width:18px;height:18px}

  /* ---------- Vacío ---------- */
  .vacio{text-align:center;padding:54px 20px;color:var(--gris)}
  .vacio .em{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:#fff;
    display:grid;place-items:center;box-shadow:var(--sombra)}
  .vacio .em svg{width:30px;height:30px;color:var(--azul)}
  .vacio h3{font-family:'Poppins';font-size:1.05rem;color:var(--tinta);margin-bottom:4px}

  /* ---------- Barra agregar (fija abajo) ---------- */
  .agregar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--linea);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,24,40,.06)}
  .agregar-inner{max-width:640px;margin:0 auto;display:flex;gap:8px}
  .agregar input.nom{flex:1;padding:13px 14px;border:1px solid var(--linea);border-radius:13px;font-size:.95rem;outline:none}
  .agregar input.nom:focus{border-color:var(--azul)}
  .fab{width:50px;flex:none;background:var(--azul);color:#fff;border-radius:13px;display:grid;place-items:center;transition:background .15s,transform .1s}
  .fab:hover{background:var(--azul-osc)}
  .fab:active{transform:scale(.94)}
  .fab svg{width:24px;height:24px}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .overlay.abierto{display:flex}
  .modal{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:subir .22s ease}
  @media(min-width:520px){.overlay{align-items:center}.modal{border-radius:22px}}
  @keyframes subir{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .modal h2{font-family:'Poppins';font-size:1.15rem;margin-bottom:16px}
  .campo{margin-bottom:13px}
  .campo label{display:block;font-size:.78rem;font-weight:600;color:var(--gris);margin-bottom:5px}
  .campo input,.campo select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:11px;font-size:.95rem;outline:none}
  .campo input:focus,.campo select:focus{border-color:var(--azul)}
  .fila{display:flex;gap:10px}
  .fila .campo{flex:1}
  .modal-btns{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;padding:13px;border-radius:12px;font-weight:600;font-size:.95rem}
  .btn-prim{background:var(--azul);color:#fff}
  .btn-prim:hover{background:var(--azul-osc)}
  .btn-sec{background:#f1f4f9;color:var(--gris)}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--tinta);color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;
    z-index:80;opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--sombra)}
  .toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--rojo)}

  /* ---------- Config faltante ---------- */
  .aviso{background:#fff7e6;border:1px solid #ffe2a8;color:#7a5800;border-radius:14px;
    padding:14px 16px;margin:16px;font-size:.86rem;line-height:1.5;max-width:640px}
  .aviso code{background:#fff;border:1px solid #ffe2a8;border-radius:6px;padding:1px 6px;font-size:.82em}
</style>
</head>
<body>

<header>
  <div class="marca">
    <svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l1.6 6.2L19 4.3l-3.1 5.5 6.2 1.2-6.2 1.2 3.1 5.5-5.4-2.9L12 23l-1.6-6.2-5.4 2.9 3.1-5.5L1.9 13l6.2-1.2L5 6.3l5.4 2.9z"/></svg>
    <div>Lista de compras<small>Walmart · Marvin & Karol</small></div>
  </div>
  <div class="resumen">
    <div class="pill"><div class="lbl">Por comprar</div><div class="val" id="rPend">0</div></div>
    <div class="pill"><div class="lbl">En el carrito</div><div class="val" id="rListos">0</div></div>
    <div class="pill total"><div class="lbl">Estimado</div><div class="val" id="rTotal">₡0</div></div>
  </div>
</header>

<div id="avisoConfig" class="aviso" style="display:none">
  ⚠️ Falta conectar Supabase. Pegá tu <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> al inicio del &lt;script&gt; (las encontrás en Project Settings → API).
</div>

<main>
  <div class="barra">
    <div class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="busqueda" type="text" placeholder="Buscar producto..." />
    </div>
    <select id="filtroCat" class="filtro"><option value="">Todas</option></select>
  </div>
  <div id="lista"></div>
</main>

<!-- Barra agregar rápido -->
<div class="agregar">
  <div class="agregar-inner">
    <input id="agregarRapido" class="nom" type="text" placeholder="Agregar producto y Enter..." />
    <button class="fab" id="btnAbrirModal" title="Más detalles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</div>

<!-- Modal agregar / editar -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitulo">Nuevo producto</h2>
    <div class="campo">
      <label>Producto</label>
      <input id="fNombre" type="text" placeholder="Ej. Leche Dos Pinos" />
    </div>
    <div class="fila">
      <div class="campo">
        <label>Cantidad</label>
        <input id="fCantidad" type="number" min="0.1" step="0.1" value="1" />
      </div>
      <div class="campo">
        <label>Unidad</label>
        <select id="fUnidad">
          <option value="und">und</option>
          <option value="kg">kg</option>
          <option value="gr">gr</option>
          <option value="lt">lt</option>
          <option value="paq">paq</option>
        </select>
      </div>
    </div>
    <div class="fila">
      <div class="campo">
        <label>Categoría</label>
        <select id="fCategoria">
          <option>General</option><option>Frutas y Verduras</option><option>Lácteos</option>
          <option>Carnes</option><option>Panadería</option><option>Abarrotes</option>
          <option>Bebidas</option><option>Limpieza</option><option>Cuidado personal</option>
          <option>Snacks</option><option>Congelados</option>
        </select>
      </div>
      <div class="campo">
        <label>Precio unit. (₡)</label>
        <input id="fPrecio" type="number" min="0" step="1" value="0" />
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-sec" id="btnCancelar">Cancelar</button>
      <button class="btn btn-prim" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1) CONFIGURACIÓN SUPABASE  ← pegá tus credenciales aquí
   ============================================================ */
const SUPABASE_URL = "https://dtupckpebkltsieamzsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dXBja3BlYmtsdHNpZWFtenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzA1MDgsImV4cCI6MjA5NzY0NjUwOH0.YCer2Xw87Nvk6pECWqfxascg7Qt3bOBCJZqZ1VGmdrg";

const configOk = !SUPABASE_URL.startsWith("TU_") && !SUPABASE_ANON_KEY.startsWith("TU_");
let sb = null;
if (configOk) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
else document.getElementById("avisoConfig").style.display = "block";

/* ============================================================
   2) ESTADO LOCAL
   ============================================================ */
let productos = [];     // arreglo en memoria (optimistic UI)
let editandoId = null;  // id del producto en edición, o null si es nuevo

const $ = (id) => document.getElementById(id);
const fmt = (n) => "₡" + Math.round(Number(n) || 0).toLocaleString("es-CR");

/* ============================================================
   3) CARGA INICIAL
   ============================================================ */
async function cargar() {
  if (!configOk) { renderAll(); return; }
  try {
    const { data, error } = await sb
      .from("productos")
      .select("*")
      .order("creado_en", { ascending: false });
    if (error) throw error;
    productos = data || [];
    renderAll();
  } catch (e) {
    console.error(e);
    toast("No se pudo cargar la lista", true);
  }
}

/* ============================================================
   4) RENDER  (aislado por try/catch en cada sección)
   ============================================================ */
function renderAll() {
  try { renderResumen(); } catch (e) { console.error("resumen", e); }
  try { renderFiltros(); } catch (e) { console.error("filtros", e); }
  try { renderLista(); }   catch (e) { console.error("lista", e); }
}

function renderResumen() {
  const pend = productos.filter(p => !p.comprado);
  const listos = productos.filter(p => p.comprado);
  const total = productos.reduce((s, p) => s + (Number(p.precio) || 0) * (Number(p.cantidad) || 0), 0);
  $("rPend").textContent = pend.length;
  $("rListos").textContent = listos.length;
  $("rTotal").textContent = fmt(total);
}

function renderFiltros() {
  const cats = [...new Set(productos.map(p => p.categoria))].sort();
  const sel = $("filtroCat");
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  sel.value = actual;
}

function renderLista() {
  const cont = $("lista");
  const q = $("busqueda").value.trim().toLowerCase();
  const cat = $("filtroCat").value;

  let vis = productos.filter(p => {
    const okQ = !q || p.nombre.toLowerCase().includes(q);
    const okC = !cat || p.categoria === cat;
    return okQ && okC;
  });

  if (vis.length === 0) {
    cont.innerHTML = `
      <div class="vacio">
        <div class="em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L23 7H6"/>
          <circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></div>
        <h3>${q || cat ? "Sin resultados" : "Tu lista está vacía"}</h3>
        <p>${q || cat ? "Probá con otra búsqueda." : "Agregá tu primer producto abajo."}</p>
      </div>`;
    return;
  }

  // Pendientes arriba, comprados abajo
  const pend = vis.filter(p => !p.comprado);
  const listos = vis.filter(p => p.comprado);

  let html = "";
  if (pend.length) {
    html += `<div class="grupo-titulo">Por comprar <span class="cuenta">${pend.length}</span></div>`;
    html += pend.map(itemHTML).join("");
  }
  if (listos.length) {
    html += `<div class="grupo-titulo">En el carrito <span class="cuenta">${listos.length}</span></div>`;
    html += listos.map(itemHTML).join("");
  }
  cont.innerHTML = html;
}

function itemHTML(p) {
  const sub = (Number(p.precio) || 0) * (Number(p.cantidad) || 0);
  return `
    <div class="item ${p.comprado ? "listo" : ""}">
      <button class="check" onclick="toggleComprado('${p.id}')" title="Marcar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
      <div class="info">
        <div class="nombre">${esc(p.nombre)}</div>
        <div class="meta">
          <span class="cat-tag">${esc(p.categoria)}</span>
          <span>${fmtCant(p.cantidad)} ${esc(p.unidad)}</span>
          ${sub > 0 ? `<span>· ${fmt(sub)}</span>` : ""}
        </div>
      </div>
      <div class="acciones">
        <button class="ic" onclick="abrirEditar('${p.id}')" title="Editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="ic del" onclick="eliminar('${p.id}')" title="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>
    </div>`;
}

const fmtCant = (n) => Number(n) % 1 === 0 ? Number(n) : Number(n).toFixed(1);

/* ============================================================
   5) CRUD  (optimistic: actualizo el arreglo + renderAll() ya)
   ============================================================ */

// CREAR -----------------------------------------------------
async function crear(datos) {
  if (!datos.nombre.trim()) { toast("Escribí el nombre", true); return; }
  if (!configOk) { toast("Conectá Supabase primero", true); return; }

  const temp = {
    id: "tmp-" + Date.now(),
    nombre: datos.nombre.trim(),
    cantidad: Number(datos.cantidad) || 1,
    unidad: datos.unidad || "und",
    categoria: datos.categoria || "General",
    precio: Number(datos.precio) || 0,
    comprado: false,
    creado_en: new Date().toISOString()
  };
  productos.unshift(temp);     // optimista
  renderAll();

  try {
    const { id, creado_en, ...payload } = temp;
    const { data, error } = await sb.from("productos").insert(payload).select().single();
    if (error) throw error;
    // reemplazo el temporal por el real
    const i = productos.findIndex(p => p.id === temp.id);
    if (i !== -1) productos[i] = data;
    renderAll();
    toast("Producto agregado");
  } catch (e) {
    console.error(e);
    productos = productos.filter(p => p.id !== temp.id); // revierto
    renderAll();
    toast("No se pudo agregar", true);
  }
}

// EDITAR ----------------------------------------------------
async function actualizar(id, cambios) {
  if (!configOk) return;
  const i = productos.findIndex(p => p.id === id);
  if (i === -1) return;
  const previo = { ...productos[i] };
  productos[i] = { ...productos[i], ...cambios };  // optimista
  renderAll();

  try {
    const { error } = await sb.from("productos").update(cambios).eq("id", id);
    if (error) throw error;
  } catch (e) {
    console.error(e);
    productos[i] = previo;  // revierto
    renderAll();
    toast("No se pudo guardar el cambio", true);
  }
}

// MARCAR COMPRADO -------------------------------------------
function toggleComprado(id) {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  actualizar(id, { comprado: !p.comprado });
}

// ELIMINAR --------------------------------------------------
async function eliminar(id) {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.nombre}"?`)) return;

  const previo = [...productos];
  productos = productos.filter(x => x.id !== id);  // optimista
  renderAll();

  if (!configOk) return;
  try {
    const { error } = await sb.from("productos").delete().eq("id", id);
    if (error) throw error;
    toast("Producto eliminado");
  } catch (e) {
    console.error(e);
    productos = previo;  // revierto
    renderAll();
    toast("No se pudo eliminar", true);
  }
}

/* ============================================================
   6) MODAL agregar / editar
   ============================================================ */
function abrirNuevo() {
  editandoId = null;
  $("modalTitulo").textContent = "Nuevo producto";
  $("fNombre").value = ""; $("fCantidad").value = 1; $("fUnidad").value = "und";
  $("fCategoria").value = "General"; $("fPrecio").value = 0;
  $("overlay").classList.add("abierto");
  $("fNombre").focus();
}

function abrirEditar(id) {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  editandoId = id;
  $("modalTitulo").textContent = "Editar producto";
  $("fNombre").value = p.nombre;
  $("fCantidad").value = p.cantidad;
  $("fUnidad").value = p.unidad;
  $("fCategoria").value = p.categoria;
  $("fPrecio").value = p.precio;
  $("overlay").classList.add("abierto");
  $("fNombre").focus();
}

function cerrarModal() { $("overlay").classList.remove("abierto"); }

function guardarModal() {
  const datos = {
    nombre: $("fNombre").value,
    cantidad: $("fCantidad").value,
    unidad: $("fUnidad").value,
    categoria: $("fCategoria").value,
    precio: $("fPrecio").value
  };
  if (!datos.nombre.trim()) { toast("Escribí el nombre", true); return; }

  if (editandoId) {
    actualizar(editandoId, {
      nombre: datos.nombre.trim(),
      cantidad: Number(datos.cantidad) || 1,
      unidad: datos.unidad,
      categoria: datos.categoria,
      precio: Number(datos.precio) || 0
    });
    toast("Cambios guardados");
  } else {
    crear(datos);
  }
  cerrarModal();
}

/* ============================================================
   7) UTILIDADES
   ============================================================ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
let toastT;
function toast(msg, err = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast ver" + (err ? " err" : "");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = "toast", 2200);
}

/* ============================================================
   8) EVENTOS
   ============================================================ */
$("btnAbrirModal").onclick = abrirNuevo;
$("btnCancelar").onclick = cerrarModal;
$("btnGuardar").onclick = guardarModal;
$("overlay").onclick = (e) => { if (e.target.id === "overlay") cerrarModal(); };
$("busqueda").oninput = renderLista;
$("filtroCat").onchange = renderLista;

$("agregarRapido").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const nombre = e.target.value.trim();
    if (!nombre) return;
    crear({ nombre, cantidad: 1, unidad: "und", categoria: "General", precio: 0 });
    e.target.value = "";
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") cerrarModal();
  if (e.key === "Enter" && $("overlay").classList.contains("abierto")) guardarModal();
});

/* ============================================================
   9) ARRANQUE
   ============================================================ */
cargar();
</script>
</body>
